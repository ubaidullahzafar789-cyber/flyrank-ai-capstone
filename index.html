<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | FlyRank</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="settings-page">
    <section class="settings-panel" aria-labelledby="settings-title">
      <p class="eyebrow">Account</p>
      <h1 id="settings-title">Settings</h1>
      <p class="intro">Update the details associated with your account.</p>

      <form id="settings-form" novalidate>
        <div class="field-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error" required>
          <p id="name-error" class="error-message" role="alert"></p>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required>
          <p id="email-error" class="error-message" role="alert"></p>
        </div>

        <button type="submit">Save changes</button>
        <p id="success-message" class="success-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
